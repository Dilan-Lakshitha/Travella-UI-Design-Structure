<app-card class="max-w-md mx-auto mt-20">
  <app-card-header>
    <app-card-title>Reset Password</app-card-title>
    <app-card-description>
      First-time login detected for <strong>{{ email }}</strong>. Please set a new password.
    </app-card-description>
  </app-card-header>

  <app-card-content class="space-y-4">
    <div class="space-y-2">
      <app-label for="newPassword">New Password</app-label>
      <app-input id="newPassword" type="password" [(ngModel)]="newPassword" />
    </div>

    <div class="space-y-2">
      <app-label for="confirmPassword">Confirm Password</app-label>
      <app-input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" />
    </div>

    @if (errorMessage) {
      <p class="text-sm text-red-600">{{ errorMessage }}</p>
    }
  </app-card-content>

  <app-card-footer>
    <button class="btn btn-primary w-full" (click)="submit()" [disabled]="isSubmitting">
      <app-icon name="circle-check" [size]="16" class="mr-2" />
      @if (isSubmitting) { Updating... } @else { Update Password }
    </button>
  </app-card-footer>
</app-card>
